# Configuration du lanceur NetHack
#
# Chaque section correspond à une entrée du menu, affichée dans l'ordre du fichier.
#   libelle   : texte affiché dans le menu
#   chemin    : programme à lancer (~ et $VARIABLES sont acceptés)
#   arguments : options passées au programme (facultatif),
#               ex. : arguments = -u MonPerso -p Valkyrie
#   touche    : raccourci clavier, une lettre autre que q (facultatif)
#   groupe    : titre du groupe où ranger l'entrée (facultatif) ; les entrées
#               d'un même groupe sont affichées ensemble
#   description : texte affiché en bas du menu plein écran quand l'entrée
#               est sélectionnée (facultatif)
#   fichiers_recents : motifs de fichiers (ex. ~/cartes/*.lua), séparés par des
#               espaces ; le menu propose de rouvrir le plus récent (facultatif)
#   heros     : oui pour l'éditeur de héros (nhheroedit) : le menu ajoute une
#               entrée par héros de son projet, qui lance une partie avec lui
#
# La section [options] est réservée : elle règle le lanceur lui-même.
#   dossier_nethack : dossier de données de NetHack (HACKDIR), où sont lus
#                     les scores ; laisser vide pour ne pas les afficher
#   nombre_scores   : nombre de meilleurs scores affichés (0 pour aucun)
#   rumeur          : affiche une rumeur de NetHack au hasard (oui / non)
#   fichier_rumeurs : fichier des rumeurs (facultatif ; par défaut rumors
#                     ou rumors.<langue> dans dossier_nethack)
#   langue          : langue des noms du jeu (rôles, monstres, rumeurs…), ex.
#                     fr@cyber ; auto : celle de l'option language de NetHack
#                     (~/.nethackrc). Avec fr@cyber, le lanceur passe aussi
#                     dans l'univers cyberpunk (Night City)
#   theme           : couleurs du menu : auto (cyber pour la version
#                     cyberpunk, sinon classique), classique, cyber ou sobre
#   souris          : clic, double-clic et molette dans le menu (oui / non)
#   journal         : fichier où noter chaque lancement (date, durée, code de
#                     sortie) ; laisser vide pour ne pas tenir de journal

[options]
dossier_nethack = ~/nh/install/games/lib/nethackdir
nombre_scores = 3
rumeur = oui
langue = auto
theme = auto
souris = oui
journal = ~/.local/state/nethack_launcher/journal.tsv

[nethack]
libelle = Jack-in : NetHack
chemin = ~/nh/install/games/nethack
touche = n
groupe = Réseau
description = Se brancher sur Night City pour un nouveau run, ou reprendre le run sauvegardé.

[editeur]
libelle = Éditeur de secteurs
chemin = ~/JEUX/NETHACK/NetHack_MapEditor/nhmapedit.sh
touche = e
groupe = Atelier
description = Dessine les plans des secteurs spéciaux de Night City (scripts Lua).
fichiers_recents = ~/JEUX/NETHACK/NetHack_MapEditor/essais/*.lua ~/nh/install/games/lib/nethackdir/*.lua

[monstres]
libelle = Fabrique de robots
chemin = ~/JEUX/NETHACK/NetHack_MonsterEditor/nhmonedit.sh
touche = m
groupe = Atelier
description = Conçoit les robots et mechas de Night City et les injecte dans le jeu.
fichiers_recents = ~/JEUX/NETHACK/NetHack_MonsterEditor/*.json

[heros]
libelle = Clinique d'identités
chemin = ~/JEUX/NETHACK/NetHack_HeroEditor/nhheroedit.sh
touche = h
groupe = Atelier
description = Façonne les héros de Night City (rôle, race, implants de départ, tuile) et lance un run avec eux.
fichiers_recents = ~/JEUX/NETHACK/NetHack_HeroEditor/*.json
heros = oui
